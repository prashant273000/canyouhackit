<!doctype html>
<html lang="en">
  <body>
    <main id="feed">
      <article data-demo-post data-post-id="static-1" data-author="Ada" data-thread-id="thread-1">
        <p data-demo-post-text>Static demo post</p>
        <img data-demo-post-image src="/static-image.png" alt="Static post image" />
      </article>
    </main>
    <pre id="results">Running parser checks…</pre>

    <script src="../universal-post.js"></script>
    <script src="../adapters/base-adapter.js"></script>
    <script src="../adapters/demo-adapter.js"></script>
    <script src="../parser.js"></script>
    <script>
      const results = document.querySelector("#results");
      const feed = document.querySelector("#feed");
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };

      async function run() {
        const parser = new UniversalContentParser([new DemoFeedAdapter()]);
        const staticPosts = parser.scan(feed);

        assert(staticPosts.length === 1, "Static post was not found.");
        assert(staticPosts[0].id === "static-1", "Static post id was not normalized.");
        assert(staticPosts[0].text === "Static demo post", "Static post text was not extracted.");
        assert(staticPosts[0].images.length === 1, "Static post image was not extracted.");
        assert(staticPosts[0].element.matches("[data-demo-post]"), "Element reference was not preserved.");

        const observedPosts = [];
        parser.start(feed, (post) => observedPosts.push(post));

        const dynamicPost = document.createElement("article");
        dynamicPost.dataset.demoPost = "";
        dynamicPost.dataset.postId = "dynamic-1";
        dynamicPost.innerHTML = '<p data-demo-post-text>Dynamic demo post</p>';
        feed.append(dynamicPost);

        await new Promise((resolve) => setTimeout(resolve, 0));
        assert(observedPosts.length === 1, "Dynamic post was not observed.");
        assert(observedPosts[0].id === "dynamic-1", "Dynamic post was not normalized.");

        const duplicatePost = dynamicPost.cloneNode(true);
        feed.append(duplicatePost);
        await new Promise((resolve) => setTimeout(resolve, 0));
        assert(observedPosts.length === 1, "Duplicate post was processed more than once.");

        parser.stop();
        results.textContent = "PASS: static posts, dynamic posts, and duplicate detection.";
      }

      run().catch((error) => {
        results.textContent = `FAIL: ${error.message}`;
      });
    </script>
  </body>
</html>
